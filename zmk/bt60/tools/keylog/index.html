<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key Logger</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--muted:#6b6a66;--line:#d7d4cc;--card:#fff;--accent:#2f6fdf}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#ecebe6;--muted:#a3a19a;--line:#3b3a37;--card:#272725}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,sans-serif;padding:20px 16px}
main{max-width:720px;margin:0 auto}h1{font-size:20px;margin:0 0 6px}p{color:var(--muted);margin:0 0 14px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
td,th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted);font-weight:500}
code{font:12px ui-monospace,Menlo,monospace}button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;margin-bottom:12px}
#sync{color:var(--accent);font-weight:600}
</style></head><body><main>
<h1>Key logger</h1>
<p>Click here once, then press keys. Every key down and up is listed and sent to Claude. <span id="sync"></span></p>
<button id="clear">Clear</button>
<table><thead><tr><th>#</th><th>Event</th><th>Code</th><th>Key</th><th>Side</th><th>Held mods</th></tr></thead><tbody id="log"></tbody></table>
</main><script>
const events = [];
const side = l => ["", "left", "right", "numpad"][l] || "";
function send(){ fetch("/results", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({events})})
  .then(r => document.getElementById("sync").textContent = r.ok ? "Sent ✓" : "Not sent").catch(() => document.getElementById("sync").textContent = "Not sent: server stopped?"); }
function log(e){
  e.preventDefault(); if (e.repeat) return;
  const mods = ["Ctrl","Shift","Alt","Meta"].filter(m => e.getModifierState(m)).join("+");
  events.push({t: Math.round(performance.now()), type: e.type, code: e.code, key: e.key, side: side(e.location), mods});
  const ev = events[events.length - 1];
  document.getElementById("log").insertAdjacentHTML("afterbegin", `<tr><td>${events.length}</td><td>${ev.type === "keydown" ? "down" : "up"}</td><td><code>${ev.code}</code></td><td><code>${ev.key === " " ? "Space" : ev.key}</code></td><td>${ev.side}</td><td>${ev.mods}</td></tr>`);
  send();
}
addEventListener("keydown", log, true); addEventListener("keyup", log, true);
document.getElementById("clear").onclick = e => { events.length = 0; document.getElementById("log").innerHTML = ""; send(); e.target.blur(); };
send();
</script></body></html>
