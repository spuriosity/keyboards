# Live keymap editing with ZMK Studio (https://zmk.studio) over USB.
CONFIG_ZMK_STUDIO=y

# Battery life: deep sleep after 15 minutes idle (any key wakes it), and lights off when idle.
# The stock BT60 V2 config never sleeps and turns the RGB underglow on at start-up.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# Room in the key queue for the battery report text (2 entries per typed character).
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=160
